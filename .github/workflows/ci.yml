name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate package definitions
        run: |
          ruby -c Formula/close-my-lid.rb
          ruby -c Casks/close-my-lid.rb
          brew style Formula/close-my-lid.rb Casks/close-my-lid.rb
          brew tap --custom-remote krishkalaria12/close-my-lid "$GITHUB_WORKSPACE"
          brew audit --strict --online --tap krishkalaria12/close-my-lid

      - name: Install and test CLI formula
        run: |
          brew install --formula krishkalaria12/close-my-lid/close-my-lid
          brew test krishkalaria12/close-my-lid/close-my-lid

      - name: Install and verify macOS app
        run: |
          app_directory="$RUNNER_TEMP/Applications"
          brew install --cask krishkalaria12/close-my-lid/close-my-lid --appdir="$app_directory"
          test -x "$app_directory/Close My Lid.app/Contents/MacOS/CloseMyLid"
          file "$app_directory/Close My Lid.app/Contents/MacOS/CloseMyLid" | grep -F 'arm64'

  automatic-tap-resolution:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: macos-15

    steps:
      - name: Verify conventional tap resolution
        run: |
          brew tap krishkalaria12/close-my-lid
          brew info --cask krishkalaria12/close-my-lid/close-my-lid
          brew info --formula krishkalaria12/close-my-lid/close-my-lid
